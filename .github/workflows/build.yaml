name: Build Alien Shooter Port

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-aarch64:
    name: Build AArch64 (ARM64) Universal Port
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install cross-toolchain and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake ninja-build libsdl2-dev

    - name: Build with AArch64 cross-compiler
      run: |
        mkdir -p build && cd build
        cmake .. \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
        cmake --build . --config Release

    - name: Prepare PortMaster Package
      run: |
        mkdir -p package/alienport/lib/arm64-v8a
        mkdir -p package/alienport/savedata
        cp build/alienport package/alienport/
        cp "Alien Shooter.sh" package/
        cp port.json package/alienport/ 2>/dev/null || true
        cp gameinfo.xml package/alienport/ 2>/dev/null || true

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: alienport-r36s-aarch64
        path: |
          build/alienport
          package/
