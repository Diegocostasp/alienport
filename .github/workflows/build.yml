name: Build Alien Shooter Port

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cross-Compiler and SDL2
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libsdl2-dev:arm64 libgles2-mesa-dev:arm64
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DSDL2_INCLUDE_DIR=/usr/include/SDL2 \
            -DSDL2_LIBRARY=/usr/lib/aarch64-linux-gnu/libSDL2.so
      
      - name: Build
        run: |
          cd build
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alienport-binary
          path: build/alienport
