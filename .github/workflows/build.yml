name: Build Alien Shooter Port

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libsdl2-dev:arm64
          # We need SDL2 for aarch64. The easiest way is to let CMake find it or bundle headers.
          # For PortMaster, we often link against a bundled SDL2 or system one.
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DARM64=ON
      
      - name: Build
        run: |
          cd build
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alienport-binary
          path: build/alienport
