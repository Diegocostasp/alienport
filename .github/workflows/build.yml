name: Build Alien Shooter Port

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-aarch64:
    name: Build AArch64 (ARM64) Universal Port
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build with Docker (Ubuntu 20.04 LTS for R36S GLIBC 2.31 compatibility)
      run: |
        chmod +x scripts/build_docker.sh
        docker run --rm -v "${{ github.workspace }}:/work" -w /work ubuntu:20.04 ./scripts/build_docker.sh

    - name: Prepare PortMaster Package
      run: |
        mkdir -p package/alienport/lib/arm64-v8a
        mkdir -p package/alienport/savedata
        cp build/alienport package/alienport/
        cp "Alien Shooter.sh" package/
        cp port.json package/alienport/ 2>/dev/null || true
        cp gameinfo.xml package/alienport/ 2>/dev/null || true
        chmod +x package/"Alien Shooter.sh" package/alienport/alienport

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: alienport-r36s-aarch64
        path: |
          build/alienport
          package/
