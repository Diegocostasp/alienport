name: Build Alien Shooter Port

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-aarch64:
    name: Build AArch64 (ARM64) Universal Port
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build with Docker (Debian Bullseye for R36S GLIBC 2.31 compatibility)
      run: |
        docker run --rm -v "${{ github.workspace }}:/work" -w /work debian:bullseye bash -c '
          set -e
          sed -i "/security/d" /etc/apt/sources.list || true
          echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99no-check-valid-until
          dpkg --add-architecture arm64
          apt-get update -o Acquire::Check-Valid-Until=false
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config \
            cmake \
            libsdl2-dev:arm64 \
            libgles2-mesa-dev:arm64 \
            libegl1-mesa-dev:arm64

          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DPKG_CONFIG_EXECUTABLE=/usr/bin/aarch64-linux-gnu-pkg-config
          cmake --build . --config Release -j$(nproc)
          aarch64-linux-gnu-strip alienport
          chmod -R 777 /work/build
        '

    - name: Prepare PortMaster Package
      run: |
        mkdir -p package/alienport/lib/arm64-v8a
        mkdir -p package/alienport/savedata
        cp build/alienport package/alienport/
        cp "Alien Shooter.sh" package/
        cp port.json package/alienport/ 2>/dev/null || true
        cp gameinfo.xml package/alienport/ 2>/dev/null || true
        chmod +x package/"Alien Shooter.sh" package/alienport/alienport

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: alienport-r36s-aarch64
        path: |
          build/alienport
          package/
