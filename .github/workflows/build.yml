name: Build Alien Shooter Port

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Multiarch and Mirrors
        run: |
          sudo dpkg --add-architecture arm64
          # Adiciona os mirrors de ARM64 (ports.ubuntu.com)
          sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list.d/*.list || true
          sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs) main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs)-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libsdl2-dev:arm64 libgles2-mesa-dev:arm64
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DSDL2_INCLUDE_DIR=/usr/include/SDL2 \
            -DSDL2_LIBRARY=/usr/lib/aarch64-linux-gnu/libSDL2.so
      
      - name: Build
        run: |
          cd build
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alienport-binary
          path: build/alienport
